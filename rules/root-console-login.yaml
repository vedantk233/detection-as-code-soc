name: root-console-login
description: Detect AWS root account console login events.
log_source: aws_cloudtrail
attack:
  technique: T1078
  name: Valid Accounts
severity: high
owner: soc-team
query:
  event_source: signin.amazonaws.com
  event_name: ConsoleLogin
  user_type: Root
  response_elements:
    ConsoleLogin: Success
false_positive_notes: >
  Verify whether the root login was authorized.
  Root account use should be exceptional.
enabled: true
